name: Z24x4Trainer
options:
  bundleIdPrefix: ca.logolo.z24x4
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hant
    - es
    - ja
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true

packages:
  SharedCore:
    path: SharedCore

targets:
  Z24x4Trainer:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: SharedCore
      - target: Z24x4Widgets
    entitlements:
      path: App/Z24x4Trainer.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.ca.logolo.z24x4
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "3"
        PRODUCT_BUNDLE_IDENTIFIER: ca.logolo.z24x4.Z24x4Trainer
        INFOPLIST_KEY_CFBundleDisplayName: "Z2/4×4 Trainer"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Reads your heart rate, workouts, active energy, resting heart rate and body weight to calculate your training zones and weekly targets."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Saves your Zone 2 and Norwegian 4×4 workouts to Apple Health."
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        # Distribution signing: team passed at archive time
        # (`DEVELOPMENT_TEAM=XXXX … -allowProvisioningUpdates`).
        CODE_SIGN_STYLE: Automatic

  Z24x4TrainerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - Watch
    dependencies:
      - package: SharedCore
      - target: Z24x4WatchComplications
    entitlements:
      path: Watch/Z24x4TrainerWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.ca.logolo.z24x4
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "3"
        PRODUCT_BUNDLE_IDENTIFIER: ca.logolo.z24x4.Z24x4Trainer.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: "Z2/4×4 Trainer"
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: ca.logolo.z24x4.Z24x4Trainer
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Reads your live heart rate during a workout to show your training zone and 4×4 interval targets."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Saves your Zone 2 and Norwegian 4×4 workouts to Apple Health."
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

  Z24x4Widgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    dependencies:
      - package: SharedCore
    entitlements:
      path: Widgets/Z24x4Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ca.logolo.z24x4
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "Z2/4×4"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.logolo.z24x4.Z24x4Trainer.Widgets
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "3"

  Z24x4WatchComplications:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - WatchComplications
    dependencies:
      - package: SharedCore
    entitlements:
      path: WatchComplications/Z24x4WatchComplications.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ca.logolo.z24x4
    info:
      path: WatchComplications/Info.plist
      properties:
        CFBundleDisplayName: "Z2/4×4"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.logolo.z24x4.Z24x4Trainer.watchkitapp.Complications
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "3"

  Z24x4TrainerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Z24x4Trainer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  Z24x4Trainer:
    build:
      targets:
        Z24x4Trainer: all
        Z24x4TrainerTests: [test]
    test:
      targets:
        - Z24x4TrainerTests
