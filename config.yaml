# Spectra project config for Z2/4×4 Trainer.
# NOTE: schema is a best guess from the Spectra UI (專案說明 + 產出規則). If Spectra
# expects different keys, open the project in Spectra and paste these into its editor.

project:
  name: Z24x4Trainer
  repo: https://github.com/ozzyfly/z2-4x4-trainer

# 專案說明 — project background injected into all artifact commands.
description: |
  Z2/4×4 Trainer — local-only iOS + Apple Watch cardio app (SwiftUI, SwiftData, HealthKit,
  Swift Charts; iOS 18+/watchOS 11+). Prescribes daily/weekly Zone 2 (60–70% maxHR) and
  Norwegian 4×4 (warmup → 4×[4min @85–95% / 3min recovery] → cooldown, 43 min) workouts, plus
  weekly health-maintenance / weight-loss targets. Inputs: manual entry or Apple Health.
  maxHR = 220 − age (user override-able). No backend, no login. Developer is a Swift beginner.
  All training math lives in the SharedCore Swift package (no UI/HealthKit), fully unit-tested.

# 產出規則 — generation rules every artifact must follow.
rules: |
  - Swift 6, SwiftUI, SwiftData. iOS 18+ / watchOS 11+.
  - All domain logic goes in SharedCore, written test-first with Swift Testing. No UI/HealthKit deps there.
  - HealthKit access sits behind a protocol so the domain stays mockable/testable.
  - One type per file; keep files small and single-purpose.
  - Run `cd SharedCore && swift test` and keep it green before touching UI.
  - Update PROGRESS.md and commit at the end of every spec. A spec is done only when tests pass.
  - Xcode project is generated from project.yml via xcodegen; never hand-edit the .xcodeproj.

# 規格 — one spec per phase (進行中 → 已封存). Phase 0–1 already 已封存.
specs:
  - id: phase-0-setup
    title: Project + tooling setup
    status: archived
  - id: phase-1-domain
    title: SharedCore domain (TDD, no UI)
    status: archived
  - id: phase-2-ios-ui
    title: iOS app — onboarding, Today, Week, Workout detail, Settings, manual entry
    status: in_progress
  - id: phase-3-healthkit
    title: HealthKit read + progress vs targets + charts
    status: todo
  - id: phase-4-watch
    title: Apple Watch app — live HR, zones, 4×4 interval engine, save + sync
    status: todo
  - id: phase-5-appstore
    title: App Store readiness — privacy, screenshots, TestFlight, submit
    status: todo
