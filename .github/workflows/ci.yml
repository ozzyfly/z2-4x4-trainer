# CI: domain tests on every push/PR; full iOS + watchOS builds on PRs to main.
#
# SharedCore is a pure Swift package (no HealthKit/SwiftData), so its tests run
# fast on a bare macOS runner. The app jobs need xcodegen + a simulator.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: SharedCore tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Run SharedCore tests
        run: swift test --package-path SharedCore

  ios-build-test:
    name: iOS build + tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; devs=[d["name"] for v in json.load(sys.stdin)["devices"].values() for d in v if d["name"].startswith("iPhone")]; print(sorted(devs)[-1])')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"
      - name: Build + unit tests
        run: |
          xcodebuild -project Z24x4Trainer.xcodeproj -scheme Z24x4Trainer \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            test

  watch-build:
    name: watchOS build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build watch app
        run: |
          xcodebuild -project Z24x4Trainer.xcodeproj -scheme Z24x4TrainerWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
